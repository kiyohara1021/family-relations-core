name: Feature request
description: Suggest a focused kinship, validation, or layout improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem to solve
      description: Describe the reusable family-graph problem, not a private family situation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: The request and examples contain only synthetic family data.
          required: true
